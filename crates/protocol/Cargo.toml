[package]
name = "lethora-protocol"
version.workspace = true
license.workspace = true
edition = "2024"
publish = false

[dependencies]
crc32fast = "1"
# Random keys and nonces; the version already in Cargo.lock.
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Hashes chaining the members log; the version already in Cargo.lock.
sha2 = "0.10"
# Envelopes and wrapped invite keys: XChaCha20-Poly1305; 0.10 shares the
# RustCrypto base crates with sha2 0.10.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# Device and invite signatures (Ed25519). Keys come from getrandom seeds, so
# no rand_core; the default `zeroize` wipes secret keys on drop.
ed25519-dalek = "2"
# Device and invite exchange keys (X25519) for key epochs;
# `static_secrets` for keys kept across starts.
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Invite keys from the link secret and sealed epoch keys; 0.12 matches sha2
# 0.10.
hkdf = "0.12"
