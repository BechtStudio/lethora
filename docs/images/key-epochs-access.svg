<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 485" width="980" height="485" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <symbol id="yes" viewBox="0 0 28 28"><circle cx="14" cy="14" r="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><path d="M8,14.5 L12.5,19 L20,10" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="no" viewBox="0 0 28 28"><circle cx="14" cy="14" r="13" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><path d="M9.5,9.5 L18.5,18.5 M18.5,9.5 L9.5,18.5" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/></symbol>
    <style>
      .head { font-size: 13px; font-weight: 700; fill: #475569; }
      .who { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .role { font-size: 12px; fill: #64748b; }
      .how { font-size: 12.5px; fill: #334155; }
      .pill { font-size: 12px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="980" height="485" rx="18" fill="#fffdf7"/>
  <text x="490" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">After the switch: who can open what</text>
  <text x="490" y="64" text-anchor="middle" font-size="13" fill="#475569">Dave joins a week later through an invite link Alice made before she removed Bob.</text>

  <!-- Column heads -->
  <text x="40" y="104" class="head">WHO</text>
  <g transform="translate(395 0)">
    <text x="0" y="98" text-anchor="middle" class="head">CONTENT FROM BEFORE</text>
    <rect x="-18" y="106" width="36" height="20" rx="10" fill="#2563eb"/><text x="0" y="120" text-anchor="middle" class="pill">K1</text>
  </g>
  <g transform="translate(565 0)">
    <text x="0" y="98" text-anchor="middle" class="head">NEW CONTENT</text>
    <rect x="-18" y="106" width="36" height="20" rx="10" fill="#ea580c"/><text x="0" y="120" text-anchor="middle" class="pill">K2</text>
  </g>
  <text x="660" y="104" class="head">HOW THEY GOT K2</text>
  <line x1="30" y1="136" x2="950" y2="136" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Alice -->
  <g transform="translate(0 136)">
    <text x="40" y="30" class="who">Alice</text><text x="40" y="48" class="role">owner, removed Bob</text>
    <use href="#yes" x="381" y="18" width="28" height="28"/>
    <use href="#yes" x="551" y="18" width="28" height="28"/>
    <text x="660" y="30" class="how">Her app made it, and locked a copy</text>
    <text x="660" y="48" class="how">for her own device too.</text>
    <line x1="30" y1="64" x2="950" y2="64" stroke="#e2e8f0"/>
  </g>

  <!-- Carol -->
  <g transform="translate(0 200)">
    <text x="40" y="30" class="who">Carol</text><text x="40" y="48" class="role">editor</text>
    <use href="#yes" x="381" y="18" width="28" height="28"/>
    <use href="#yes" x="551" y="18" width="28" height="28"/>
    <text x="660" y="30" class="how">Her locked copy came with the</text>
    <text x="660" y="48" class="how">"epoch 2" entry of the members log.</text>
    <line x1="30" y1="64" x2="950" y2="64" stroke="#e2e8f0"/>
  </g>

  <!-- Dave -->
  <g transform="translate(0 264)">
    <rect x="30" y="2" width="920" height="72" rx="10" fill="#fef3c7" opacity="0.6"/>
    <text x="40" y="30" class="who">Dave</text><text x="40" y="48" class="role">joins later by invite link</text>
    <use href="#yes" x="381" y="22" width="28" height="28"/>
    <use href="#yes" x="551" y="22" width="28" height="28"/>
    <text x="660" y="26" class="how">The link's secret opens the keys stored</text>
    <text x="660" y="44" class="how">with the invite (K1) and the copy of K2</text>
    <text x="660" y="62" class="how">locked for the link in the "epoch 2" entry.</text>
    <line x1="30" y1="76" x2="950" y2="76" stroke="#e2e8f0"/>
  </g>

  <!-- Bob -->
  <g transform="translate(0 340)">
    <text x="40" y="30" class="who" fill="#991b1b">Bob</text><text x="40" y="48" class="role">removed</text>
    <use href="#yes" x="381" y="18" width="28" height="28"/>
    <text x="395" y="62" text-anchor="middle" class="role">he saw it already</text>
    <use href="#no" x="551" y="18" width="28" height="28"/>
    <text x="660" y="30" class="how">He didn't: no copy was locked</text>
    <text x="660" y="48" class="how">for his devices.</text>
    <line x1="30" y1="70" x2="950" y2="70" stroke="#e2e8f0"/>
  </g>

  <!-- Server -->
  <g transform="translate(0 410)">
    <text x="40" y="30" class="who">Server</text><text x="40" y="48" class="role">stores everything</text>
    <use href="#no" x="381" y="18" width="28" height="28"/>
    <use href="#no" x="551" y="18" width="28" height="28"/>
    <text x="660" y="30" class="how">Never: it only ever sees locked copies</text>
    <text x="660" y="48" class="how">and sealed content.</text>
  </g>
</svg>
