# lethora-server behind nginx (see docs/dev/server.md): a file for
# /etc/nginx/conf.d/ (included in the http block), not a whole nginx.conf.
# lethora-server listens on 127.0.0.1:8740 (the default); in its config set
#   public_url = "https://sync.example.org"
#   trusted_proxies = ["127.0.0.1"]
# The certificate paths are certbot's; use your own.

# WebSocket upgrades: "Connection: upgrade" only when the client asks for one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sync.example.org;

    ssl_certificate     /etc/letsencrypt/live/sync.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.example.org/privkey.pem;

    # Snapshots and images are uploaded in one request of up to asset_bytes
    # (100 MiB by default); nginx's default is 1 MiB.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8740;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # The server takes the last address that isn't a trusted proxy.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Above idle_seconds (120 s): the server closes idle connections
        # itself; apps ping every 30 s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name sync.example.org;
    return 301 https://$host$request_uri;
}
